name: Keep API Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      HEALTH_URL: ${{ vars.TUTR_API_HEALTH_URL || secrets.TUTR_API_HEALTH_URL }}
    steps:
      - name: Ping API health endpoint
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::Set TUTR_API_HEALTH_URL as a GitHub Actions variable or secret to enable keep-awake pings."
            exit 0
          fi

          curl --fail --silent --show-error \
            --max-time 60 \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            "$HEALTH_URL"
