spring:
  application:
    name: tutr-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tutr}
    username: ${DATABASE_USERNAME:tutr_user}
    password: ${DATABASE_PASSWORD:tutr_password}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:5}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      keepalive-time: ${DATABASE_KEEPALIVE_TIME_MS:300000}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
    expiration-minutes: 1440
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  google-calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/v1/calendar/google/callback}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    profile-image-bucket: ${SUPABASE_PROFILE_IMAGE_BUCKET:profile-images}
