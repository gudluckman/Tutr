services:
  postgres:
    image: postgres:16-alpine
    container_name: tutr-postgres
    environment:
      POSTGRES_DB: tutr
      POSTGRES_USER: tutr_user
      POSTGRES_PASSWORD: tutr_password
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutr_user -d tutr"]
      interval: 10s
      timeout: 5s
      retries: 5
